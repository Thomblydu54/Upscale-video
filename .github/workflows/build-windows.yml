name: Build Windows EXE

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances de build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Télécharger Real-ESRGAN, les modèles IA et FFmpeg
        run: python scripts/fetch_tools.py --platform windows

      - name: Lire la version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import upscaler; print(upscaler.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Construire l'exe (fichier unique)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name UpscaleVideoAI
          --icon assets/icon.ico
          --splash assets/splash.png
          --add-data "bin;bin"
          --add-data "assets;assets"
          --add-data "ui;ui"
          --collect-data sv_ttk
          --collect-all tkinterdnd2
          --distpath dist/onefile
          --workpath build/onefile
          main.py

      - name: Construire la version portable (dossier)
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name UpscaleVideoAI
          --icon assets/icon.ico
          --add-data "bin;bin"
          --add-data "assets;assets"
          --add-data "ui;ui"
          --collect-data sv_ttk
          --collect-all tkinterdnd2
          --distpath dist/onedir
          --workpath build/onedir
          main.py

      - name: Auto-test de l'exe
        timeout-minutes: 8
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/onefile/UpscaleVideoAI.exe" -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          $summary = (Get-Content selftest.txt | Where-Object { $_ -match "^(OK|INFO|FAIL|SELFTEST)" }) -join " | "
          Write-Output "::notice title=selftest::$summary"
          if ($p.ExitCode -ne 0) {
            $fails = (Get-Content selftest.txt | Where-Object { $_ -like "FAIL*" }) -join " | "
            Write-Output "::error title=selftest::$fails"
            throw "Auto-test échoué (code $($p.ExitCode))"
          }

      - name: Capture d'écran (list)
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        env:
          UPSCALER_DEMO: "list"
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Output "Résolution inchangée : $_" }
          $p = Start-Process -FilePath "dist/onedir/UpscaleVideoAI/UpscaleVideoAI.exe" -PassThru
          Start-Sleep -Seconds 25
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $w = [Math]::Min(1280, $b.Width); $h = [int]($b.Height * $w / $b.Width)
          $small = New-Object System.Drawing.Bitmap $bmp, $w, $h
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq "image/jpeg" }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 38L
          $small.Save("$PWD/shot-list.jpg", $codec, $ep)
          Get-Process UpscaleVideoAI -ErrorAction SilentlyContinue | Stop-Process -Force
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD/shot-list.jpg"))
          $size = 4000
          $n = [Math]::Ceiling($b64.Length / $size)
          Write-Output "Écran $($b.Width)x$($b.Height), base64 $($b64.Length) caractères, $n morceaux"
          for ($i = 0; $i -lt [Math]::Min($n, 20); $i++) {
            $chunk = $b64.Substring($i * $size, [Math]::Min($size, $b64.Length - $i * $size))
            $kind = if ($i -lt 10) { "notice" } else { "warning" }
            Write-Output "::$kind title=shot-list-$i-of-$n::$chunk"
          }

      - name: Capture d'écran (preview)
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        env:
          UPSCALER_DEMO: "preview"
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Output "Résolution inchangée : $_" }
          $p = Start-Process -FilePath "dist/onedir/UpscaleVideoAI/UpscaleVideoAI.exe" -PassThru
          Start-Sleep -Seconds 28
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $w = [Math]::Min(1280, $b.Width); $h = [int]($b.Height * $w / $b.Width)
          $small = New-Object System.Drawing.Bitmap $bmp, $w, $h
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq "image/jpeg" }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 38L
          $small.Save("$PWD/shot-preview.jpg", $codec, $ep)
          Get-Process UpscaleVideoAI -ErrorAction SilentlyContinue | Stop-Process -Force
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD/shot-preview.jpg"))
          $size = 4000
          $n = [Math]::Ceiling($b64.Length / $size)
          Write-Output "Écran $($b.Width)x$($b.Height), base64 $($b64.Length) caractères, $n morceaux"
          for ($i = 0; $i -lt [Math]::Min($n, 20); $i++) {
            $chunk = $b64.Substring($i * $size, [Math]::Min($size, $b64.Length - $i * $size))
            $kind = if ($i -lt 10) { "notice" } else { "warning" }
            Write-Output "::$kind title=shot-preview-$i-of-$n::$chunk"
          }

      - name: Préparer les fichiers à publier
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/onefile/UpscaleVideoAI.exe release/UpscaleVideoAI.exe
          Compress-Archive -Path dist/onedir/UpscaleVideoAI -DestinationPath release/UpscaleVideoAI-portable.zip
          Get-ChildItem release | Format-Table Name, @{n="Mo";e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: UpscaleVideoAI-windows
          path: release/*
          retention-days: 30

      - name: Publier la release GitHub
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[release]'))
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          NOTES="Téléchargez **UpscaleVideoAI.exe** et double-cliquez dessus : c'est tout.
          
          - \`UpscaleVideoAI.exe\` : un seul fichier, rien à installer.
          - \`UpscaleVideoAI-portable.zip\` : même application en dossier (démarrage plus rapide).
          
          Nécessite Windows 10/11 64 bits et une carte graphique compatible Vulkan (NVIDIA, AMD ou Intel, pilotes à jour)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Upscale Video AI $TAG" --notes "$NOTES"
          fi
