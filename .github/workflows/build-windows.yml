name: Build Windows EXE

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances de build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Télécharger Real-ESRGAN, les modèles IA et FFmpeg
        run: python scripts/fetch_tools.py --platform windows

      - name: Lire la version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import upscaler; print(upscaler.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Construire l'exe (fichier unique)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name UpscaleVideoAI
          --icon assets/icon.ico
          --splash assets/splash.png
          --add-data "bin;bin"
          --add-data "assets;assets"
          --add-data "ui;ui"
          --collect-data sv_ttk
          --collect-all tkinterdnd2
          --distpath dist/onefile
          --workpath build/onefile
          main.py

      - name: Construire la version portable (dossier)
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name UpscaleVideoAI
          --icon assets/icon.ico
          --add-data "bin;bin"
          --add-data "assets;assets"
          --add-data "ui;ui"
          --collect-data sv_ttk
          --collect-all tkinterdnd2
          --distpath dist/onedir
          --workpath build/onedir
          main.py

      - name: Auto-test de l'exe
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:UPV_CHILD_MARKER = "$PWD\child.txt"
          $p = Start-Process -FilePath "dist/onefile/UpscaleVideoAI.exe" -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait -PassThru
          if (Select-String -Path selftest.txt -Pattern "update-child: lancé" -Quiet) {
            Start-Sleep -Seconds 20
            if (Test-Path child.txt) { $c = Get-Content child.txt } else { $c = "CHILD FAIL (aucun résultat)" }
            Add-Content selftest.txt "INFO relance après mise à jour : $c"
            if ($c -notmatch "CHILD OK") { Add-Content selftest.txt "FAIL relance après mise à jour"; Add-Content selftest.txt "SELFTEST FAILED" }
          }
          Get-Content selftest.txt
          $summary = (Get-Content selftest.txt | Where-Object { $_ -match "^(OK|INFO|FAIL|SELFTEST)" }) -join " | "
          Write-Output "::notice title=selftest::$summary"
          if ($p.ExitCode -ne 0 -or (Select-String -Path selftest.txt -Pattern "SELFTEST FAILED" -Quiet)) {
            $fails = (Get-Content selftest.txt | Where-Object { $_ -like "FAIL*" }) -join " | "
            Write-Output "::error title=selftest::$fails"
            throw "Auto-test échoué (code $($p.ExitCode))"
          }

      - name: Préparer les fichiers à publier
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/onefile/UpscaleVideoAI.exe release/UpscaleVideoAI.exe
          Compress-Archive -Path dist/onedir/UpscaleVideoAI -DestinationPath release/UpscaleVideoAI-portable.zip
          Get-ChildItem release | Format-Table Name, @{n="Mo";e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: UpscaleVideoAI-windows
          path: release/*
          retention-days: 30

      - name: Publier la release GitHub
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[release]'))
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          CHANGES=$(python -c "import re,sys; t=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## v?'+re.escape(sys.argv[1])+r'\b.*?\n(.*?)(?=^## |\Z)', t, re.S|re.M); print(m.group(1).strip() if m else '')" "${TAG#v}")
          NOTES="${CHANGES}
          
          ---
          Téléchargez **UpscaleVideoAI.exe** et double-cliquez dessus : c'est tout. Si vous avez déjà l'application, elle se met à jour toute seule.
          
          - \`UpscaleVideoAI.exe\` : un seul fichier, rien à installer.
          - \`UpscaleVideoAI-portable.zip\` : même application en dossier (démarrage plus rapide).
          
          Nécessite Windows 10/11 64 bits et une carte graphique compatible Vulkan (NVIDIA, AMD ou Intel, pilotes à jour)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Upscale Video AI $TAG" --notes "$NOTES"
          fi
